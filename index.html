<meta name="mobile-web-app-capable" content="yes">

<title>黃家烤雞員工旅遊｜東京行程手冊</title>
<style>
:root{--bg:#eef6ff;--paper:#fff;--ink:#1d2b3a;--navy:#0b3b7a;--tab:#ffb800;--tabink:#fff;--teal:#46807f;--mint:#ccf8f6;--mute:#6b7a8a;--line:#e3ebf3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a2b;--paper:#17263a;--ink:#e8eef6;--navy:#8fb8f0;--mint:#1f3d44;--mute:#9bb0c6;--line:#27384f}}
:root[data-theme="dark"]{--bg:#0e1a2b;--paper:#17263a;--ink:#e8eef6;--navy:#8fb8f0;--mint:#1f3d44;--mute:#9bb0c6;--line:#27384f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.book{flex:1;position:relative;perspective:1600px;margin:12px 14px 6px;max-width:560px;width:calc(100% - 28px);align-self:center;min-height:0}
.pg{position:absolute;inset:0;background:var(--paper);border-radius:10px 18px 18px 10px;box-shadow:-3px 0 0 var(--line),0 10px 28px rgba(11,59,122,.18);transform-origin:left center;transition:transform .75s cubic-bezier(.4,.1,.2,1),opacity .5s;display:flex;flex-direction:column;overflow:hidden;backface-visibility:hidden}
.pg{-webkit-backface-visibility:hidden}.pg.past{transform:rotateY(-180deg);pointer-events:none;visibility:hidden;transition:transform .7s cubic-bezier(.4,.1,.2,1),visibility 0s .7s}
.pg.nx{pointer-events:none}
.pg.far{opacity:0;pointer-events:none}
.sh{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(0,0,0,0) 65%);opacity:0;transition:opacity .7s;border-radius:inherit;z-index:5}.past .sh{opacity:1}
.tab{background:var(--tab);color:var(--tabink);font-weight:800;font-size:26px;padding:12px 22px;border-radius:0 0 18px 0;align-self:flex-start;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.body{flex:1;overflow-y:auto;padding:12px 20px 20px;-webkit-overflow-scrolling:touch}
.sub{color:var(--mute);font-size:13px;margin:0 0 6px}
h3{margin:16px 0 4px;color:var(--navy);font-size:16px;border-bottom:2px solid var(--line);padding-bottom:3px}
ul{margin:4px 0;padding-left:18px}li{margin:4px 0;line-height:1.55;font-size:15px}
li.n{color:var(--mute);list-style:none;margin-left:-4px;font-size:13px}
a{color:var(--teal);text-decoration:none;border-bottom:1.5px dotted var(--teal);font-weight:600}
.edit a{border-bottom-style:solid;background:var(--mint);padding:0 3px;border-radius:4px}
.cover{justify-content:center;align-items:center;text-align:center;padding:24px;background:linear-gradient(180deg,var(--mint),var(--paper) 60%)}
.cover h1{font-size:34px;color:var(--navy);margin:8px 0;line-height:1.25}
.cover .ban{background:var(--navy);color:#fff;padding:10px 26px;border-radius:12px;font-size:22px;font-weight:800;margin-top:14px}
.cover p{color:var(--mute);margin:14px 0 0}
.fl{background:var(--mint);border:3px solid var(--teal);border-radius:12px;margin:10px 0;overflow:hidden}
.fl b.h{display:block;background:var(--teal);color:#fff;padding:6px 14px;font-size:22px}
.fl div{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;text-align:center;font-size:13px;color:var(--ink)}
.fl strong{display:block;font-size:22px}
nav{display:flex;align-items:center;gap:8px;justify-content:center;padding:6px 14px 10px}
button,select{font:inherit;font-size:15px;border:0;border-radius:999px;padding:10px 18px;background:var(--navy);color:var(--paper);cursor:pointer}
button:disabled{opacity:.3}button.s{background:var(--paper);color:var(--navy);border:1.5px solid var(--navy);padding:8px 12px;font-size:13px}
button.s.on{background:var(--tab);color:#fff;border-color:var(--tab)}
select{background:var(--paper);color:var(--navy);border:1.5px solid var(--navy);padding:8px 10px;max-width:38vw}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--tab);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.pg{transition:none}}

.mt{display:flex;gap:8px;margin:2px 0 8px}
.mapimg{width:100%;border-radius:10px;display:block;border:1px solid var(--line);cursor:zoom-in}
.nm{display:flex;gap:8px;align-items:center;margin:12px 0 4px}.nm input{flex:1;font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--navy);background:var(--paper);color:var(--ink);min-width:0}
.st{font-size:12.5px;color:var(--mute);margin:2px 0 6px;line-height:1.5}
.ah{margin:14px 0 4px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}.ah i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rd{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.rd.on{background:var(--mint)}
.ck{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--navy);background:var(--paper);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:16px;padding:0}
.rd.on .ck{background:var(--navy);color:var(--paper)}
.rn{flex:1;font-size:15px;line-height:1.45}.who{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.who span{font-size:12px;background:var(--tab);color:#fff;border-radius:999px;padding:1px 8px}
.ct{flex:none;font-weight:800;color:var(--navy);min-width:22px;text-align:right}
.zm{position:fixed;inset:0;background:rgba(0,0,0,.88);overflow:auto;z-index:9;display:none}.zm.on{display:block}.zm .mw{width:240%;max-width:none;cursor:default}.zm img{width:100%;display:block;border:0;border-radius:0}
.zm button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:10}
.er{display:flex;gap:6px;margin:4px 0;align-items:center}.ei{flex:1;min-width:0;font:inherit;font-size:15px;padding:7px 9px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}.ec{width:40px;height:34px;padding:0;border:0;background:none;flex:none}.ah .ei{font-weight:700}
.mw{position:relative}.pins{position:absolute;inset:0;pointer-events:none}.pin{position:absolute;transform:translate(-50%,-50%);min-width:24px;height:24px;border-radius:999px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;padding:0 4px}.pin.ed{opacity:.8;width:14px;min-width:14px;height:14px;padding:0}.pin.mk{outline:3px solid var(--tab)}.pl{margin:2px 0 6px}

nav{flex-wrap:wrap}
.av{display:inline-block;width:22px;height:22px;border-radius:50%;overflow:hidden;vertical-align:middle;flex:none}.av svg{display:block;width:100%;height:100%}
.pk{position:fixed;inset:0;background:rgba(14,26,43,.78);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.pk.on{display:flex}
.pkb{background:var(--paper);border-radius:18px;padding:18px 14px;max-width:420px;width:100%;max-height:100%;overflow:auto;text-align:center}.pkb h2{margin:0 0 4px;color:var(--navy)}.pkb p{margin:0 0 12px;color:var(--mute);font-size:13px}
.pkg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pkg button{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}.pkg b{font-size:18px}.pkg small{color:var(--mute);font-size:12px}.pkg .av{width:64px;height:64px}
.who .wc{display:inline-flex;align-items:center;gap:4px;background:var(--mint);color:var(--ink);padding:1px 9px 1px 2px}.who .wc .av{width:20px;height:20px}
.pin.pv{height:auto;background:#fff;padding:2px;border:3px solid;gap:0}.pa{width:24px;height:24px;border-radius:50%;overflow:hidden;border:2px solid #fff;margin-left:-9px;flex:none;display:block}.pa:first-child{margin-left:0}.pa svg{display:block;width:100%;height:100%}.pin.pv em{font-style:normal;color:#333;font-size:12px;padding:0 4px}
.nm .av{width:30px;height:30px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}.sw.on{border:3px solid var(--navy)}
.ar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0;text-align:left}.ar b{width:44px;font-size:13px;color:var(--mute)}.pv{margin:6px 0}
.bgg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.bgg button{height:54px;border:2px solid var(--line);border-radius:12px;font-size:12px;color:#333;padding:0}
